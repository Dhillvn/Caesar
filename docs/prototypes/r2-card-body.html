<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Caesar — round 2: the map card body</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* ==============================================================
   CAESAR — ROUND 2. Built against /DESIGN.md (Factory + Numen accents).
   Source spec: docs/prototypes/design-md/factory.md

   Held constant from s2-factory.html: every token, the nav, the hero,
   the Dashboard Frame, the ledger, the Bone CTA card.

   Ruled since s2 and applied to all three variants:
     - maps lead the page; the Bone card drops below them (#182, Raj).

   The ONE variable under test: how the ticket list inside a map card
   is organised. A = full list (control) · B = next-first + cap
   · C = grouped by state. Nothing else differs between them.
   ============================================================== */
:root{
  --obsidian-canvas:#101010; --carbon-lift:#1d1a18; --ash-stroke:#3d3a39;
  --graphite-mid:#4d4947; --warm-granite:#8a8380; --pale-stone:#b8b3b0;
  --bone:#eeeeee; --chalk:#fafafa;
  --copper-signal:#C87941;  /* live status. 5.68:1 on canvas */
  --teal-metric:#0D9488;   /* settled state. 5.09:1 on canvas */
  --btn-dark:#1f1d1c; --frame:#0d0d0d;
  --font-geist:'Geist',Inter,system-ui,ui-sans-serif,sans-serif;
  --font-geist-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --page-max-width:1200px; --section-gap:96px; --card-padding:24px; --element-gap:24px;
  --radius-nav:3px; --radius-buttons:3px; --radius-cards:10px; --radius-largepanels:20px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--obsidian-canvas);color:var(--bone);
  font:400 16px/1.5 var(--font-geist);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit;
  transition:color .15s cubic-bezier(.4,0,.2,1),border-color .15s cubic-bezier(.4,0,.2,1)}
.wrap{max-width:var(--page-max-width);margin:0 auto;padding:0 24px}
.mono{font:400 12px/1 var(--font-geist-mono);letter-spacing:-.24px;text-transform:uppercase}

/* ---------- Top Navigation Bar ---------- */
nav{height:64px;display:flex;align-items:center;gap:32px;
  max-width:var(--page-max-width);margin:0 auto;padding:0 24px}
nav .mark{font:400 12px/1 var(--font-geist-mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone)}
nav .links{display:flex;gap:28px;margin-left:24px}
nav .links a{font:400 14px/1 var(--font-geist);text-transform:uppercase;
  letter-spacing:-.02em;color:var(--bone)}
nav .links a:hover{color:var(--warm-granite)}
nav .right{margin-left:auto;display:flex;align-items:center;gap:16px}
.ghost{background:transparent;border:1px solid var(--ash-stroke);border-radius:0;
  color:var(--bone);padding:12px 16px;font:400 14px/1 var(--font-geist);cursor:pointer}
.ghost:hover{color:var(--chalk);border-color:var(--chalk)}
.light-btn{background:var(--chalk);color:var(--obsidian-canvas);border:0;
  border-radius:var(--radius-buttons);padding:12px 14px;
  font:400 14px/1 var(--font-geist);cursor:pointer}
.dark-btn{background:var(--btn-dark);color:var(--bone);border:0;
  border-radius:var(--radius-buttons);padding:12px 14px;
  font:400 14px/1 var(--font-geist);cursor:pointer}

/* ---------- the variant switch: prototype chrome, not part of the design ---------- */
.switch{display:flex;border:1px solid var(--ash-stroke);border-radius:var(--radius-buttons);
  overflow:hidden}
.switch button{background:transparent;border:0;color:var(--warm-granite);cursor:pointer;
  padding:10px 14px;font:400 12px/1 var(--font-geist-mono);letter-spacing:-.24px;
  text-transform:uppercase;border-left:1px solid var(--ash-stroke)}
.switch button:first-child{border-left:0}
.switch button[aria-pressed="true"]{background:var(--carbon-lift);color:var(--bone)}

/* ---------- Hero ---------- */
.hero{display:grid;grid-template-columns:1fr 2fr;gap:40px;align-items:start;padding-top:80px}
.eyebrow{color:var(--pale-stone);margin-bottom:24px;display:flex;align-items:center;gap:8px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--copper-signal);flex:none}
h1{font:400 72px/1 var(--font-geist);letter-spacing:-2.88px;color:var(--bone);margin:0}
.hero p{font:400 16px/1.5 var(--font-geist);color:var(--warm-granite);margin:24px 0 0}
.hero .btns{display:flex;gap:16px;margin-top:32px}

/* ---------- Dashboard Frame ---------- */
.frame{background:var(--frame);border-radius:var(--radius-cards);overflow:hidden}
.frame .bar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--carbon-lift)}
.dot{width:8px;height:8px;border-radius:50%}
.frame .bar .title{margin-left:12px;color:var(--pale-stone)}
.frame .bar .live{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--pale-stone)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr)}
.tile{padding:20px;border-top:1px solid var(--carbon-lift);border-left:1px solid var(--carbon-lift)}
.tile:nth-child(3n+1){border-left:0}
.tile .lab{color:var(--pale-stone)}
.tile .val{font:400 36px/1.1 var(--font-geist);letter-spacing:-1.12px;color:var(--bone);margin-top:12px}

/* ---------- Feature Card Row = one card per map ---------- */
.sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:32px}
.sec-head h2{font:400 44px/1.12 var(--font-geist);letter-spacing:-1.1px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--element-gap)}
.card{background:transparent;border:1px solid var(--carbon-lift);
  border-radius:var(--radius-cards);padding:20px;display:flex;flex-direction:column}
.card .cap{color:var(--pale-stone);display:flex;align-items:center;gap:8px}
.card .cap .copy{margin-left:auto;background:transparent;border:0;cursor:pointer;
  color:var(--graphite-mid);font:400 12px/1 var(--font-geist-mono);letter-spacing:-.24px;
  text-transform:uppercase;padding:0}
.card .cap .copy:hover{color:var(--bone)}
.card h3{font:400 20px/1.3 var(--font-geist);letter-spacing:-.031em;color:var(--bone);margin:16px 0 0}
.card .meta{color:var(--warm-granite);font:400 14px/1.43 var(--font-geist);margin-top:8px}
.rows{margin-top:20px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;
  border-top:1px solid var(--carbon-lift)}
.rn{font:400 12px/1.6 var(--font-geist-mono);letter-spacing:-.24px;
  color:var(--graphite-mid);width:34px;flex:none}
.rt{font:400 14px/1.43 var(--font-geist);color:var(--bone);flex:1}
.rb{display:block;color:var(--warm-granite);margin-top:4px;
  font:400 12px/1.4 var(--font-geist-mono);letter-spacing:-.24px;text-transform:uppercase}
.st{font:400 12px/1.6 var(--font-geist-mono);letter-spacing:-.24px;text-transform:uppercase;
  color:var(--warm-granite);white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px}
.st.live{color:var(--copper-signal)}
.st.you{color:var(--bone)}
.st.good{color:var(--teal-metric)}
.st.off{color:var(--graphite-mid)}
.more{margin-top:auto;padding-top:20px;display:inline-block;color:var(--bone);
  font:400 14px/1 var(--font-geist)}
.more span{border-bottom:1px solid var(--ash-stroke);padding-bottom:6px}
.more:hover span{color:var(--chalk);border-color:var(--chalk)}

/* --- B only: the next takeable ticket, promoted --- */
.next{border-top:1px solid var(--carbon-lift);padding:16px 0 4px}
.next .lab{color:var(--copper-signal);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.next .t{font:400 16px/1.4 var(--font-geist);letter-spacing:-.02em;color:var(--bone);display:block}
.next .sub{margin-top:8px;display:flex;gap:12px;color:var(--warm-granite);
  font:400 12px/1 var(--font-geist-mono);letter-spacing:-.24px;text-transform:uppercase}
.rest{color:var(--graphite-mid);font:400 12px/1.6 var(--font-geist-mono);
  letter-spacing:-.24px;text-transform:uppercase;padding:12px 0;
  border-top:1px solid var(--carbon-lift)}

/* --- C only: state subheadings --- */
.ghead{color:var(--pale-stone);padding:16px 0 4px;border-top:1px solid var(--carbon-lift);
  display:flex;align-items:center;gap:8px}
.ghead .ct{margin-left:auto;color:var(--graphite-mid)}
.grp .row:first-of-type{border-top:0}
details.blocked{border-top:1px solid var(--carbon-lift);padding-top:12px;margin-top:4px}
details.blocked summary{cursor:pointer;list-style:none;color:var(--graphite-mid);
  font:400 12px/1.6 var(--font-geist-mono);letter-spacing:-.24px;text-transform:uppercase}
details.blocked summary::-webkit-details-marker{display:none}
details.blocked summary:hover{color:var(--warm-granite)}

/* ---------- Ledger ---------- */
.ledger{width:100%;border-collapse:collapse;margin-top:32px}
.ledger th{text-align:left;padding:0 16px 12px 0;color:var(--pale-stone);
  font:400 12px/1 var(--font-geist-mono);letter-spacing:-.24px;text-transform:uppercase;
  border-bottom:1px solid var(--carbon-lift)}
.ledger td{padding:16px 16px 16px 0;border-bottom:1px solid var(--carbon-lift);
  font:400 14px/1.43 var(--font-geist);color:var(--bone);vertical-align:top}
.ledger td.m{font-family:var(--font-geist-mono);letter-spacing:-.24px;
  color:var(--warm-granite);font-size:12px;text-transform:uppercase}

/* ---------- CTA Section Card — now below the maps ---------- */
.cta{background:var(--bone);border-radius:var(--radius-cards);padding:var(--card-padding);
  color:var(--obsidian-canvas);max-width:560px;position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.055;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
.cta .cap{color:var(--obsidian-canvas);display:flex;align-items:center;gap:8px}
.cta h2{font:400 36px/1.1 var(--font-geist);letter-spacing:-1.12px;
  color:var(--obsidian-canvas);margin:16px 0 0}
.cta ul{list-style:none;margin:24px 0 0;padding:0}
.cta li{display:flex;gap:12px;padding:10px 0;border-top:1px solid rgba(16,16,16,.14);
  font:400 14px/1.43 var(--font-geist)}
.cta li .n{font-family:var(--font-geist-mono);font-size:12px;letter-spacing:-.24px;
  color:var(--graphite-mid);width:34px;flex:none;line-height:1.6}
.cta .dark-btn{margin-top:24px;background:var(--obsidian-canvas)}

section{padding-top:var(--section-gap)}
footer{padding:var(--section-gap) 0 96px}
footer .h{color:var(--bone);margin-bottom:16px}
footer p{font:400 14px/1.6 var(--font-geist);color:var(--warm-granite);margin:0;max-width:620px}
</style>
</head>
<body>

<nav>
  <span class="mark">Caesar</span>
  <span class="links"><a href="#maps">Maps</a><a href="#queue">Queue</a><a href="#ledger">Ledger</a></span>
  <span class="right">
    <span class="mono" id="stamp" style="color:#b8b3b0"></span>
    <span class="switch" id="switch">
      <button data-v="A" aria-pressed="true">A · full list</button>
      <button data-v="B" aria-pressed="false">B · next first</button>
      <button data-v="C" aria-pressed="false">C · grouped</button>
    </span>
    <button class="light-btn">Sweep now</button>
  </span>
</nav>

<div class="wrap">
  <div class="hero">
    <div>
      <div class="eyebrow mono"><span class="pulse"></span>Command centre</div>
      <h1>Every map, one surface.</h1>
      <p id="sub"></p>
      <div class="btns">
        <button class="dark-btn">Take the next ticket</button>
        <button class="ghost">Status table</button>
      </div>
    </div>
    <div class="frame">
      <div class="bar">
        <span class="dot" style="background:#ff5f57"></span>
        <span class="dot" style="background:#febc2e"></span>
        <span class="dot" style="background:#28c840"></span>
        <span class="title mono">caesar — frontier</span>
        <span class="live mono"><span class="pulse"></span>live</span>
      </div>
      <div class="tiles" id="tiles"></div>
    </div>
  </div>
</div>

<div class="wrap">
  <!-- maps lead: ruled by Raj, 2026-08-16 -->
  <section id="maps">
    <div class="sec-head">
      <span class="mono" style="color:#b8b3b0">Frontiers</span>
      <h2 id="mapshead"></h2>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="queue">
    <div class="sec-head">
      <span class="mono" style="color:#b8b3b0">Your queue</span>
      <h2>What will not move without you</h2>
    </div>
    <div class="cta" id="cta"></div>
  </section>

  <section id="ledger">
    <div class="sec-head">
      <span class="mono" style="color:#b8b3b0">Ledger</span>
      <h2>What the last runs cost</h2>
    </div>
    <table class="ledger" id="runs"></table>
  </section>

  <footer>
    <div class="h mono">Round 2 — one variable: the map card body</div>
    <p id="foot"></p>
  </footer>
</div>

<script src="data.js"></script>
<script>
// ponytail: one file, three card bodies, a data-attribute switch. No framework.
var esc = function(s){return String(s).replace(/[&<>]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});};

// A row's state colour. Held identical across all three variants.
function stateClass(t){
  var state = t[4], owner = t[3];
  return state === 'Ongoing' ? 'live'
       : (state === 'Needs you' || owner === 'You') ? 'you'
       : state === 'Blocked' ? 'off' : 'good';
}
// The next takeable ticket: the highest-ranked row that nothing blocks.
function nextOf(m){
  var open = sorted(m).filter(function(t){ return t[4] !== 'Blocked'; });
  return open.length ? open[0] : null;
}
// The type/owner line under a title — what GitHub makes you hover for.
function typeLine(t){
  return t[2] + ' &middot; ' + (t[3] === 'You' ? 'you' : 'caesar') +
         (t[5] ? ' &middot; blocked by ' + t[5] : '');
}
function rowHtml(m, t){
  return '<div class="row"><span class="rn">' + t[0] + '</span>' +
    '<span class="rt"><a href="' + issueUrl(m, t[0]) + '">' + esc(t[1]) + '</a>' +
    '<span class="rb">' + typeLine(t) + '</span></span>' +
    '<span class="st ' + stateClass(t) + '">' +
    (t[4] === 'Ongoing' ? '<span class="pulse"></span>' : '') + t[4] + '</span></div>';
}

/* ---- A: every ticket, ranked. The control — what s2-factory.html already did. ---- */
function bodyA(m){
  return '<div class="rows">' + sorted(m).map(function(t){ return rowHtml(m, t); }).join('') + '</div>';
}

/* ---- B: the next takeable ticket promoted; the rest capped; blocked counted. ---- */
function bodyB(m){
  var next = nextOf(m);
  var rest = sorted(m).filter(function(t){ return t !== next && t[4] !== 'Blocked'; });
  var blocked = m.t.filter(function(t){ return t[4] === 'Blocked'; }).length;
  var CAP = 3, shown = rest.slice(0, CAP), hidden = rest.length - shown.length;
  var tail = [];
  if (hidden > 0) tail.push('+' + hidden + ' more open');
  if (blocked > 0) tail.push(blocked + ' blocked');
  return (next ?
    '<div class="next"><div class="lab mono"><span class="pulse"></span>next</div>' +
      '<a class="t" href="' + issueUrl(m, next[0]) + '">' + esc(next[1]) + '</a>' +
      '<div class="sub"><span>#' + next[0] + '</span><span>' + typeLine(next) + '</span>' +
      '<span class="' + (stateClass(next) === 'you' ? '' : '') + '">' + next[4] + '</span></div></div>'
    : '<div class="next"><div class="lab mono">next</div>' +
      '<span class="t" style="color:#8a8380">Nothing takeable — every open ticket is blocked.</span></div>') +
  '<div class="rows">' + shown.map(function(t){ return rowHtml(m, t); }).join('') + '</div>' +
  (tail.length ? '<div class="rest">' + tail.join(' &middot; ') + '</div>' : '');
}

/* ---- C: grouped under state subheadings; blocked collapsed behind a count. ---- */
function bodyC(m){
  var order = ['Needs you', 'Ongoing', 'Queued'];
  var out = order.map(function(state){
    var rows = sorted(m).filter(function(t){ return t[4] === state; });
    if (!rows.length) return '';
    return '<div class="ghead mono">' + state +
      '<span class="ct">' + rows.length + '</span></div>' +
      '<div class="rows grp">' + rows.map(function(t){ return rowHtml(m, t); }).join('') + '</div>';
  }).join('');
  var blocked = sorted(m).filter(function(t){ return t[4] === 'Blocked'; });
  if (blocked.length) {
    out += '<details class="blocked"><summary>' + blocked.length +
      ' blocked &mdash; show</summary><div class="rows grp">' +
      blocked.map(function(t){ return rowHtml(m, t); }).join('') + '</div></details>';
  }
  return out;
}

var BODY = { A: bodyA, B: bodyB, C: bodyC };

function renderGrid(v){
  document.getElementById('grid').innerHTML = MAPS.map(function(m){
    var blocked = m.t.filter(function(t){ return t[4] === 'Blocked'; }).length;
    return '<div class="card">' +
      '<div class="cap mono">Map ' + m.letter + ' &middot; ' + m.repo + ' #' + m.num +
        '<button class="copy" data-url="' + issueUrl(m, m.num) +
        '" title="copy the map URL">copy url</button></div>' +
      '<h3>' + esc(m.title) + '</h3>' +
      '<div class="meta">' + m.t.length + ' open &middot; ' + blocked + ' blocked &middot; ' +
        m.decided + ' decided</div>' +
      BODY[v](m) +
      '<a class="more" href="https://github.com/' + m.repo + '/issues/' + m.num +
        '"><span>Open the map &rarr;</span></a></div>';
  }).join('');
}

document.getElementById('switch').addEventListener('click', function(e){
  var b = e.target.closest('button[data-v]'); if (!b) return;
  [].forEach.call(this.querySelectorAll('button'), function(x){
    x.setAttribute('aria-pressed', String(x === b)); });
  renderGrid(b.dataset.v);
});
document.addEventListener('keydown', function(e){
  var v = { '1':'A', '2':'B', '3':'C' }[e.key]; if (!v) return;
  document.querySelector('#switch button[data-v="' + v + '"]').click();
});
document.addEventListener('click', function(e){
  var c = e.target.closest('.copy'); if (!c) return;
  navigator.clipboard && navigator.clipboard.writeText(c.dataset.url);
  var was = c.textContent; c.textContent = 'copied';
  setTimeout(function(){ c.textContent = was; }, 1200);
});

document.getElementById('stamp').textContent = 'swept ' + G.ago + ' ago';
document.getElementById('mapshead').textContent =
  MAPS.length === 1 ? 'One map under way' : MAPS.length + ' maps under way';
document.getElementById('sub').textContent =
  G.needsRaj + ' of the ' + G.open + ' open tickets want your hands. Caesar holds ' +
  G.caesarHolds + '. Nothing crosses into main without your word.';

// Sparklines cut: the series in s2 were fabricated, and invented data does not ship.
document.getElementById('tiles').innerHTML = [
  ['open tickets', G.open], ['need you', G.needsRaj], ['caesar holds', G.caesarHolds],
  ['decided', G.decided], ['agent slots', G.slotsUsed + ' / ' + G.slotsCap], ['maps driven', G.maps]
].map(function(t){
  return '<div class="tile"><div class="lab mono">' + t[0] + '</div>' +
         '<div class="val">' + t[1] + '</div></div>';
}).join('');

renderGrid('A');

var mine = [];
MAPS.forEach(function(m){
  sorted(m).forEach(function(t){ if (t[4] === 'Needs you' || t[3] === 'You') mine.push({ m: m, t: t }); });
});
document.getElementById('cta').innerHTML =
  '<div class="cap mono"><span class="pulse"></span>' + mine.length + ' waiting</div>' +
  '<h2>Nothing here moves until you rule it.</h2>' +
  '<ul>' + mine.map(function(x){
    return '<li><span class="n">' + x.t[0] + '</span>' +
      '<span><a href="' + issueUrl(x.m, x.t[0]) + '">' + esc(x.t[1]) + '</a></span></li>';
  }).join('') + '</ul>' +
  '<button class="dark-btn">Take the next one</button>';

document.getElementById('runs').innerHTML =
  '<thead><tr><th>Run</th><th>Repo</th><th>Result</th><th>Cost</th><th>Turns</th><th>When</th></tr></thead>' +
  '<tbody>' + G.runs.map(function(r){
    return '<tr><td class="m">#' + r.n + '</td><td class="m">' + r.repo + '</td>' +
      '<td><span class="st ' + (r.cls.indexOf('ERROR') === 0 ? 'live' : 'good') + '">' +
      r.cls + '</span>' + (r.why ? '<span class="rb">' + r.why + '</span>' : '') + '</td>' +
      '<td>' + r.cost + '</td><td class="m">' + r.turns + '</td>' +
      '<td class="m">' + r.when + '</td></tr>';
  }).join('') +
  '<tr><td class="m">#' + G.pr.n + '</td><td class="m">' + G.pr.repo + '</td>' +
  '<td><span class="st you">' + (G.pr.draft ? 'draft pr — awaiting your word' : 'ready') +
  '</span><span class="rb">' + esc(G.pr.t) + '</span></td>' +
  '<td>&mdash;</td><td class="m">&mdash;</td><td class="m">open</td></tr></tbody>';

document.getElementById('foot').textContent =
  'Generated ' + G.gen + '. Press 1, 2 or 3 to switch the card body. Everything outside the ' +
  'map cards is identical across the three, so the comparison is honest.';
</script>
</body>
</html>
