<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Caesar — command centre (Modal)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Inter:wght@400;500&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==============================================================
   MODAL — built against docs/prototypes/design-md/modal.md
   Native phosphor palette. Goga -> Space Grotesk (its own named
   substitute). Every token below traces to a row in that file.
   ============================================================== */
:root{
  /* Tokens - Colors */
  --void-black:#000000; --ground-iron:#181818; --carbon-veil:#212525;
  --circuit-border:#485346; --phosphor-blue-black:#1f2a33; --charcoal-rust:#231c1c;
  --lime-pulse:#7fee64; --phosphor-white:#ddffdc; --mint-frost:#def0dd;
  --sage-60:#8cab87; --sage-40:#677d64; --moss-70:#9cbf93; --moss-80:#aed2a4;
  --fern-link:#859984; --deep-fern:#697368; --pine-15:#3e4a3c;
  /* Typography */
  --font-goga:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-inter:'Inter',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'Fira Mono',ui-monospace,monospace;
  /* Layout */
  --page-max-width:1280px; --section-gap:80px; --card-padding:32px; --element-gap:20px;
  /* Radius */
  --radius-cards:8px; --radius-inputs:8px; --radius-buttons:12px; --radius-pills:9999px;
  /* Elevation - the only shadow in the system */
  --shadow-md:rgba(0,0,0,.1) 0 10px 15px -3px,rgba(0,0,0,.1) 0 4px 6px -4px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--void-black);color:var(--sage-60);
  font:400 16px/1.5 var(--font-inter);letter-spacing:-.352px;
  font-feature-settings:"cv11";-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-goga);color:var(--phosphor-white);margin:0}
a{color:var(--fern-link);text-decoration:none;
  transition:color .3s ease-out,background-color .3s ease-out,border-color .3s ease-out}

/* ---------- Navigation Bar ---------- */
nav{position:sticky;top:0;z-index:20;background:var(--carbon-veil);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--phosphor-blue-black);
  box-shadow:var(--shadow-md);height:64px;padding:0 24px;
  display:flex;align-items:center;gap:32px}
.logo{display:flex;align-items:center;gap:10px;
  font:500 20px/1 var(--font-goga);color:var(--phosphor-white);letter-spacing:-.017em}
.mark{width:20px;height:20px;border-radius:2px;
  background:linear-gradient(135deg,#80ee64,#18b759 55%,#09af58);
  box-shadow:0 0 14px rgba(127,238,100,.45)}
.navlinks{display:flex;gap:32px;margin-left:24px}
.navlinks a{font:500 14px/1 var(--font-inter);color:var(--phosphor-white);
  letter-spacing:-.364px}
.navlinks a:hover{color:var(--lime-pulse)}
.navright{margin-left:auto;display:flex;align-items:center;gap:20px}
.navright .txt{font:500 14px/1 var(--font-inter);color:var(--fern-link)}
/* Accent Pill Button — the rationed lime fill */
.pill-btn{background:var(--lime-pulse);color:var(--ground-iron);
  border-radius:var(--radius-pills);padding:8px 16px;
  font:500 14px/1 var(--font-inter);border:0;cursor:pointer}

/* ---------- Hero Section ---------- */
.hero{padding:96px 24px 0;text-align:center;position:relative}
.eyebrow{font:500 12px/1.33 var(--font-inter);letter-spacing:.6px;
  text-transform:uppercase;color:var(--moss-70);margin-bottom:12px}
.hero h1{font:500 64px/1 var(--font-goga);letter-spacing:-.448px}
.hero h1 .lit{color:var(--lime-pulse)}
.sub{font:400 20px/1.5 var(--font-inter);letter-spacing:-.36px;color:var(--moss-80);
  max-width:640px;margin:20px auto 0}
.ctas{display:flex;gap:12px;justify-content:center;margin-top:32px}
.cta-pill{background:var(--lime-pulse);color:var(--ground-iron);
  border-radius:var(--radius-pills);padding:16px 24px;
  font:500 16px/1 var(--font-inter);letter-spacing:-.352px;border:0;cursor:pointer}
.cta-ghost{background:transparent;border:1px solid var(--phosphor-white);
  color:var(--phosphor-white);border-radius:var(--radius-buttons);padding:16px 24px;
  font:500 16px/1 var(--font-inter);letter-spacing:-.352px;cursor:pointer}
.micro{margin-top:28px;font:400 14px/1.43 var(--font-inter);letter-spacing:-.364px;
  color:var(--deep-fern);display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.micro b{color:var(--sage-60);font-weight:400}

/* ---------- The signature visual: 3D cube in a green bloom ---------- */
.stage{height:300px;display:grid;place-items:center;position:relative;margin-top:24px}
.halo{position:absolute;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(195,198,64,.85) 0%,rgba(127,238,100,.18) 34%,transparent 70%);
  filter:blur(28px);opacity:.5;pointer-events:none}
.cube{width:150px;height:150px;position:relative;transform-style:preserve-3d;
  animation:spin 80s linear infinite;transform:rotateX(-24deg) rotateY(0deg)}
@keyframes spin{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}
.face{position:absolute;inset:0;border:1px solid rgba(127,238,100,.85);
  background:linear-gradient(135deg,rgba(128,238,100,.30),rgba(24,183,89,.22) 55%,rgba(9,175,88,.30))}
.f1{transform:translateZ(75px)} .f2{transform:rotateY(180deg) translateZ(75px)}
.f3{transform:rotateY(90deg) translateZ(75px)} .f4{transform:rotateY(-90deg) translateZ(75px)}
.f5{transform:rotateX(90deg) translateZ(75px)} .f6{transform:rotateX(-90deg) translateZ(75px)}

/* ---------- Section rhythm ---------- */
.section{max-width:var(--page-max-width);margin:0 auto;
  padding:var(--section-gap) 24px 0}
.section h2{font:500 42px/1.05 var(--font-goga);letter-spacing:-.336px}
.section .lede{font:400 16px/1.5 var(--font-inter);color:var(--sage-60);
  max-width:640px;margin-top:12px}
.divider{max-width:var(--page-max-width);margin:var(--section-gap) auto 0;
  height:1px;background:var(--phosphor-blue-black)}
/* Never more than 3 columns. */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
  gap:var(--element-gap);margin-top:40px}

/* ---------- Workload Card = one map ---------- */
.card{background:var(--ground-iron);border-radius:var(--radius-cards);
  padding:var(--card-padding);border:1px solid var(--circuit-border)}
/* isometric lime mark, per the Imagery section */
.iso{width:56px;height:56px;position:relative;transform:rotateX(55deg) rotateZ(45deg);
  margin:0 0 28px 10px}
.iso i{position:absolute;inset:0;border:1.5px solid var(--lime-pulse);border-radius:2px}
.iso i:nth-child(1){background:rgba(127,238,100,.22)}
.iso i:nth-child(2){transform:translate(-9px,-9px);
  background:rgba(127,238,100,.10);border-color:rgba(127,238,100,.55)}
.card h3{font:400 24px/1.3 var(--font-goga);letter-spacing:-.312px;margin-top:16px}
.card .meta{font:400 14px/1.43 var(--font-inter);letter-spacing:-.364px;
  color:var(--sage-40);margin-top:8px}

/* ticket rows — flat, borderless, hairline separated */
.rows{margin-top:24px}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;
  border-top:1px solid var(--phosphor-blue-black)}
.row:hover .rt{color:var(--phosphor-white)}
.rn{font:400 14px/1.43 var(--font-mono);color:var(--sage-40);width:38px;flex:none}
.rt{font:400 14px/1.43 var(--font-inter);letter-spacing:-.364px;color:var(--sage-60);flex:1}
.rb{display:block;font:400 12px/1.33 var(--font-inter);color:var(--deep-fern);margin-top:4px}

/* Tag/Chip — lime fill only for live status */
.tag{font:500 12px/1.33 var(--font-inter);padding:4px 12px;
  border-radius:var(--radius-pills);white-space:nowrap;flex:none;
  background:transparent;border:1px solid var(--circuit-border);color:var(--fern-link)}
.tag.live{background:var(--lime-pulse);border-color:var(--lime-pulse);color:var(--ground-iron)}
.tag.you{border-color:var(--phosphor-white);color:var(--phosphor-white)}
.tag.low{border-color:var(--pine-15);color:var(--deep-fern)}

/* ---------- Code Window Card = the ledger ---------- */
.win{margin-top:40px;background:var(--ground-iron);border:1px solid var(--circuit-border);
  border-radius:16px;overflow:hidden}
.win .bar{display:flex;align-items:center;gap:8px;padding:8px 16px;
  background:var(--carbon-veil);border-bottom:1px solid var(--phosphor-blue-black)}
.dot{width:8px;height:8px;border-radius:50%}
.win .bar .t{margin-left:auto;font:500 12px/1.33 var(--font-inter);color:var(--moss-70)}
.win pre{margin:0;padding:24px;font:400 14px/1.5 var(--font-mono);
  color:var(--sage-60);overflow-x:auto}
.k{color:var(--lime-pulse)} .s{color:var(--phosphor-white)} .c{color:var(--sage-40)}

footer{max-width:var(--page-max-width);margin:0 auto;
  padding:var(--section-gap) 24px 96px;
  font:400 12px/1.33 var(--font-inter);letter-spacing:.6px;
  text-transform:uppercase;color:var(--deep-fern)}
</style>
</head>
<body>

<nav>
  <span class="logo"><span class="mark"></span>Caesar</span>
  <span class="navlinks"><a href="#maps">Maps</a><a href="#ledger">Ledger</a><a href="#maps">Fog</a></span>
  <span class="navright"><span class="txt" id="stamp"></span>
    <button class="pill-btn">Sweep now</button></span>
</nav>

<div class="hero">
  <div class="eyebrow">Command centre</div>
  <h1><span class="lit">Four maps</span> under way.</h1>
  <p class="sub" id="sub"></p>
  <div class="ctas">
    <button class="cta-pill">Take the next ticket</button>
    <button class="cta-ghost">Show status table</button>
  </div>
  <div class="micro" id="micro"></div>
  <div class="stage">
    <div class="halo"></div>
    <div class="cube">
      <div class="face f1"></div><div class="face f2"></div><div class="face f3"></div>
      <div class="face f4"></div><div class="face f5"></div><div class="face f6"></div>
    </div>
  </div>
</div>

<div class="divider"></div>

<div class="section" id="maps">
  <div class="eyebrow">Frontiers</div>
  <h2>Every map, one page</h2>
  <p class="lede">One card per map. Rows sort by what needs you first, then your queue,
    then the work Caesar holds, then what is walled off behind a blocker.</p>
  <div class="grid" id="grid"></div>
</div>

<div class="divider"></div>

<div class="section" id="ledger">
  <div class="eyebrow">Ledger</div>
  <h2>What the last runs cost</h2>
  <div class="win">
    <div class="bar">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
      <span class="t">caesar-runs</span>
    </div>
    <pre id="runs"></pre>
  </div>
</div>

<footer id="foot"></footer>

<script src="data.js"></script>
<script>
// ponytail: template strings + innerHTML. Static prototype, no framework.
var esc = function(s){return String(s).replace(/[&<>]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});};
var pad = function(s,n){s=String(s);while(s.length<n){s+=' ';}return s;};

document.getElementById('stamp').textContent = 'Swept ' + G.ago + ' ago';
document.getElementById('sub').textContent =
  G.needsRaj + ' of the ' + G.open + ' open tickets want your hands. Caesar holds the rest, ' +
  'and nothing crosses into main without your word.';

document.getElementById('micro').innerHTML = [
  [G.open, 'open'], [G.needsRaj, 'need you'], [G.caesarHolds, 'Caesar holds'],
  [G.decided, 'decided'], [G.slotsUsed + ' / ' + G.slotsCap, 'agent slots'],
  ['#' + G.pr.n, 'awaiting your word']
].map(function(m){ return '<span><b>' + m[0] + '</b> ' + m[1] + '</span>'; }).join('');

document.getElementById('grid').innerHTML = MAPS.map(function(m){
  var rows = sorted(m).map(function(t){
    var state = t[4], owner = t[3];
    var cls = state === 'Ongoing' ? 'live'
            : (state === 'Needs you' || owner === 'You') ? 'you'
            : state === 'Blocked' ? 'low' : '';
    return '<div class="row"><span class="rn">' + t[0] + '</span>' +
      '<span class="rt"><a href="' + issueUrl(m, t[0]) + '" style="color:inherit">' +
      esc(t[1]) + '</a>' +
      (t[5] ? '<span class="rb">blocked by ' + t[5] + '</span>'
            : '<span class="rb">' + t[2] + '</span>') +
      '</span><span class="tag ' + cls + '">' + state + '</span></div>';
  }).join('');
  return '<div class="card">' +
    '<div class="iso"><i></i><i></i></div>' +
    '<div class="eyebrow">Map ' + m.letter + ' · ' + m.repo + ' #' + m.num + '</div>' +
    '<h3><a href="https://github.com/' + m.repo + '/issues/' + m.num +
      '" style="color:inherit">' + esc(m.title) + '</a></h3>' +
    '<div class="meta">' + m.t.length + ' open · ' + m.decided + ' decided' +
      (m.last ? ' · last was #' + m.last.n + ' ' + esc(m.last.t) : ' · no decisions yet') +
    '</div>' +
    '<div class="rows">' + rows + '</div></div>';
}).join('');

document.getElementById('runs').innerHTML =
  '<span class="c"># the last four runs, newest first</span>\n\n' +
  G.runs.map(function(r){
    return '<span class="k">' + pad('#' + r.n, 6) + '</span>' +
           '<span class="s">' + pad(r.repo, 22) + '</span>' +
           pad(r.cls, 20) + '<span class="s">' + pad(r.cost, 8) + '</span>' +
           pad(r.turns + ' turns', 11) + '<span class="c">' + r.when + '</span>' +
           (r.why ? '\n' + pad('', 6) + '<span class="c">^ ' + r.why + '</span>' : '');
  }).join('\n') +
  '\n\n<span class="c"># awaiting your word</span>\n' +
  '<span class="k">' + pad('#' + G.pr.n, 6) + '</span><span class="s">' +
  esc(G.pr.t) + '</span> <span class="c">(' + (G.pr.draft ? 'draft' : 'ready') + ')</span>';

document.getElementById('foot').textContent =
  'Modal · phosphor terminal · generated ' + G.gen;
</script>
</body>
</html>
